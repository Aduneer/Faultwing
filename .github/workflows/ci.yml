name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flytrap_test
          POSTGRES_USER: flytrap
          POSTGRES_PASSWORD: flytrap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flytrap -d flytrap_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://flytrap:flytrap@localhost:5432/flytrap_test?sslmode=disable

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run tests
        run: go test ./...

      - name: Run Python SDK tests
        run: make test-python

      - name: Run go vet
        run: go vet ./...
