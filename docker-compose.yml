services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flytrap
      POSTGRES_USER: flytrap
      POSTGRES_PASSWORD: flytrap
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro

volumes:
  postgres_data:
