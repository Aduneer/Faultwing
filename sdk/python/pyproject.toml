[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "faultwing-sdk"
version = "0.1.0"
description = "Python client for sending exceptions to Faultwing"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Aduneer" },
]
dependencies = []

[tool.setuptools.packages.find]
include = ["faultwing*"]
